<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enter Profit</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="flex flex-col h-screen items-center justify-center px-4">
    <div class="bg-white rounded-2xl shadow-md p-4 w-full max-w-3xl flex flex-col h-full">

      <!-- Header -->
      <div class="flex justify-between items-center mb-2">
        <button onclick="window.location.href='index.html'"
          class="bg-white text-blue-500 font-semibold py-2 px-4 rounded shadow hover:bg-gray-100 transition">
          ← Back
        </button>
        <h1 class="text-xl font-bold text-center flex-1" id="dateHeading"></h1>
        <div class="w-16"></div>
      </div>

      <!-- Scrollable Content -->
      <div class="flex-1 overflow-y-auto space-y-4">

        <!-- Carousel -->
        <div id="carouselWrapper" class="relative w-full hidden">
          <div class="relative w-full h-[50vh]">
            <img id="carouselImage" class="w-full h-full object-contain rounded-xl" />
            <button id="prevBtn" class="absolute left-2 top-1/2 transform -translate-y-1/2 bg-white shadow rounded-full w-8 h-8 flex items-center justify-center text-xl">&#8592;</button>
            <button id="nextBtn" class="absolute right-2 top-1/2 transform -translate-y-1/2 bg-white shadow rounded-full w-8 h-8 flex items-center justify-center text-xl">&#8594;</button>
            <button id="deleteBtn" class="absolute top-2 right-2 bg-white text-red-500 border border-red-300 rounded-full w-7 h-7 flex items-center justify-center shadow hover:bg-red-100">
              &times;
            </button>
          </div>
        </div>

        <!-- Upload -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Upload or Paste Images (Max 5)</label>
          <input type="file" id="imageInput" accept="image/*" multiple class="w-full text-sm" />
          <p id="imageCount" class="text-sm text-gray-500 mt-1">0/5 images uploaded</p>
        </div>

        <!-- Profit -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Profit</label>
          <input type="number" id="profitInput" class="border rounded p-2 w-full text-sm"
                placeholder="Enter profit for the day" />
        </div>

        <!-- Notes -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Trade Notes</label>
          <textarea id="notesInput" rows="2" class="border rounded p-2 w-full text-sm resize-none"
                    placeholder="Write your notes for the day..."></textarea>
        </div>
      </div>

      <!-- Save Button -->
      <div class="mt-4">
        <button id="saveBtn"
          class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded shadow w-full">
          Save
        </button>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const day = params.get("day");
    const month = params.get("month");
    const year = params.get("year");

    const keyPrefix = `entry-${year}-${month}-${day}`;
    const profitKey = `${keyPrefix}-profit`;
    const notesKey = `${keyPrefix}-notes`;
    const imagesKey = `${keyPrefix}-images`;

    const profitInput = document.getElementById("profitInput");
    const notesInput = document.getElementById("notesInput");
    const imageInput = document.getElementById("imageInput");

    const carouselWrapper = document.getElementById("carouselWrapper");
    const carouselImage = document.getElementById("carouselImage");
    const deleteBtn = document.getElementById("deleteBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const imageCountDisplay = document.getElementById("imageCount");

    let imageList = [];
    let currentImageIndex = 0;

    document.getElementById("dateHeading").textContent = `Enter Profit for ${day}/${month}/${year}`;

    if (localStorage.getItem(profitKey)) profitInput.value = localStorage.getItem(profitKey);
    if (localStorage.getItem(notesKey)) notesInput.value = localStorage.getItem(notesKey);
    if (localStorage.getItem(imagesKey)) {
      imageList = JSON.parse(localStorage.getItem(imagesKey));
      if (imageList.length > 0) {
        showImage(0);
        carouselWrapper.classList.remove("hidden");
        updateImageCount();
      }
    }

    document.getElementById("saveBtn").addEventListener("click", () => {
      localStorage.setItem(profitKey, profitInput.value || "");
      localStorage.setItem(notesKey, notesInput.value || "");

      try {
        localStorage.setItem(imagesKey, JSON.stringify(imageList));
      } catch (e) {
        alert("Image storage failed. Try removing or shrinking some images.");
        return;
      }

      window.location.href = `index.html?month=${month}&year=${year}`;
    });

    imageInput.addEventListener("change", async (e) => {
      const files = [...e.target.files];
      for (const file of files) {
        if (imageList.length >= 5) {
          alert("Maximum of 5 images allowed.");
          break;
        }
        await readImage(file);
      }
      showImage(currentImageIndex);
      carouselWrapper.classList.remove("hidden");
      e.target.value = "";
    });

    async function readImage(file) {
      return new Promise((resolve, reject) => {
        if (imageList.length >= 5) {
          alert("You can only upload a maximum of 5 images.");
          return reject();
        }

        const reader = new FileReader();
        reader.onload = function (e) {
          const img = new Image();
          img.onload = function () {
            const canvas = document.createElement("canvas");
            const maxWidth = 1600;
            const maxHeight = 1000;
            let width = img.width;
            let height = img.height;

            const scale = Math.min(maxWidth / width, maxHeight / height, 1);
            width *= scale;
            height *= scale;

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);

            const compressed = canvas.toDataURL("image/jpeg", 0.6);
            if (compressed.length > 2000000) {
              alert("Image is still too large after compression. Try cropping it.");
              return reject();
            }

            imageList.push(compressed);
            updateImageCount();
            resolve();
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function updateImageCount() {
      imageCountDisplay.textContent = `${imageList.length}/5 images uploaded`;
    }

    function showImage(index) {
      if (imageList.length === 0) return;
      currentImageIndex = index;
      carouselImage.src = imageList[index];
    }

    prevBtn.onclick = () => {
      if (imageList.length === 0) return;
      currentImageIndex = (currentImageIndex - 1 + imageList.length) % imageList.length;
      showImage(currentImageIndex);
    };

    nextBtn.onclick = () => {
      if (imageList.length === 0) return;
      currentImageIndex = (currentImageIndex + 1) % imageList.length;
      showImage(currentImageIndex);
    };

    deleteBtn.onclick = () => {
      imageList.splice(currentImageIndex, 1);
      updateImageCount();
      if (imageList.length === 0) {
        carouselWrapper.classList.add("hidden");
        currentImageIndex = 0;
      } else {
        currentImageIndex = Math.min(currentImageIndex, imageList.length - 1);
        showImage(currentImageIndex);
      }
    };

    window.addEventListener("paste", async (e) => {
      const items = e.clipboardData.items;
      for (const item of items) {
        if (item.type.indexOf("image") === 0 && imageList.length < 5) {
          const file = item.getAsFile();
          await readImage(file);
        }
      }
      showImage(currentImageIndex);
      carouselWrapper.classList.remove("hidden");
    });
  </script>
</body>
</html>
