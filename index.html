<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profit Calendar</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 flex flex-col items-center min-h-screen py-10">
  <!-- Top Navigation -->
  <header class="w-full bg-white shadow px-6 py-4 flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <span class="text-gray-400">Dashboard</span>
      <span class="mx-1">/</span>
      <span class="font-semibold text-gray-700">Home</span>
    </div>
    <div class="flex-1 flex justify-center">
      <input type="text" placeholder="Search" class="w-80 px-4 py-2 border rounded focus:outline-none focus:border-blue-400 text-sm bg-gray-50"/>
    </div>
    <div class="flex items-center space-x-4">
      <a href="home.html" class="text-gray-500 hover:text-blue-600" title="Home">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M3 12l2-2m0 0l7-7 7 7m-9 2v6m0 0h6m-6 0v6m6-6v6m0 0h6m-6 0v6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <a href="index.html" class="text-gray-500 hover:text-blue-600" title="Calendar">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="18" rx="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M16 2v4M8 2v4M3 10h18" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <button class="text-gray-500 hover:text-blue-600" title="Menu">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="1.5"/>
          <circle cx="19.5" cy="12" r="1.5"/>
          <circle cx="4.5" cy="12" r="1.5"/>
        </svg>
      </button>
      <button class="text-gray-500 hover:text-blue-600" title="Notifications">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="text-gray-500 hover:text-blue-600" title="Profile">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="7" r="4"/>
          <path d="M5.5 21a8.38 8.38 0 0113 0" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Redirect to Login if not authenticated -->
  <script>
    if (!localStorage.getItem("authToken")) {
      window.location.href = "login.html";
    }
  </script>

  <!-- Calendar Page -->
  <main class="w-full flex justify-center mt-8">
    <div class="w-full max-w-6xl px-4">
      <div class="bg-white rounded-2xl shadow-md p-6 w-full">
        <!-- Header -->
        <div class="flex justify-between items-center mb-4">
          <button id="prevMonthBtn" class="text-blue-600 font-medium hover:underline">← Previous</button>
          <h2 id="monthYear" class="text-2xl font-bold text-center"></h2>
          <button id="nextMonthBtn" class="text-blue-600 font-medium hover:underline">Next →</button>
        </div>
        <!-- Weekday Headers -->
        <div class="grid grid-cols-8 gap-2 text-center font-semibold mb-2">
          <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Total</div>
        </div>
        <!-- Calendar Grid -->
        <div id="calendarGrid" class="flex flex-col gap-2"></div>
      </div>
    </div>
  </main>

  <script>
    const monthYear = document.getElementById("monthYear");
    const prevMonthBtn = document.getElementById("prevMonthBtn");
    const nextMonthBtn = document.getElementById("nextMonthBtn");
    const calendarGrid = document.getElementById("calendarGrid");

    const today = new Date();
    const currentMonth = today.getMonth();
    const currentYear = today.getFullYear();

    const urlParams = new URLSearchParams(window.location.search);
    const viewMonth = parseInt(urlParams.get("month")) || currentMonth + 1;
    const viewYear = parseInt(urlParams.get("year")) || currentYear;
    let viewingDate = new Date(viewYear, viewMonth - 1, 1);

    const monthNames = [
      "January", "February", "March", "April", "May", "June",
      "July", "August", "September", "October", "November", "December"
    ];

    function renderCalendar(date) {
      calendarGrid.innerHTML = "";

      const year = date.getFullYear();
      const month = date.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();

      const prevMonthDate = new Date(year, month, 0);
      const prevMonthLastDate = prevMonthDate.getDate();
      const prevMonth = prevMonthDate.getMonth();
      const prevMonthYear = prevMonthDate.getFullYear();

      const nextMonthDate = new Date(year, month + 1, 1);
      const nextMonth = nextMonthDate.getMonth();
      const nextMonthYear = nextMonthDate.getFullYear();

      monthYear.textContent = `${monthNames[month]} ${year}`;

      const isCurrentMonth = (month === currentMonth && year === currentYear);
      nextMonthBtn.disabled = isCurrentMonth;
      nextMonthBtn.classList.toggle("text-gray-300", isCurrentMonth);
      nextMonthBtn.classList.toggle("text-blue-600", !isCurrentMonth);
      nextMonthBtn.classList.toggle("cursor-not-allowed", isCurrentMonth);
      nextMonthBtn.classList.toggle("hover:underline", !isCurrentMonth);

      let day = 1;
      let weekDayIndex = 0;
      let weekRow = null;
      let nextDay = 1;

      while (day <= lastDate || weekDayIndex % 7 !== 0) {
        if (weekDayIndex % 7 === 0) {
          if (weekRow) {
            calendarGrid.appendChild(weekRow);
          }
          weekRow = document.createElement("div");
          weekRow.className = "grid grid-cols-8 gap-2 items-stretch";
          var weekProfit = 0;
        }

        let box = document.createElement("div");

        const isBeforeFirst = weekDayIndex < firstDay && day === 1;
        const isAfterLast = day > lastDate;

        if (isBeforeFirst) {
          const prevDay = prevMonthLastDate - (firstDay - weekDayIndex - 1);
          const key = `entry-${prevMonthYear}-${prevMonth + 1}-${prevDay}-profit`;
          const savedProfit = localStorage.getItem(key);

          box.className = "border rounded-lg p-2 h-20 flex flex-col justify-start items-start relative bg-gray-100 text-gray-400 cursor-not-allowed";
          box.innerHTML = `
            <span class="absolute top-1 left-1 text-sm">${prevDay}</span>
            <span class="mt-6 ml-1 text-sm text-green-500 font-medium">${savedProfit ? `$${savedProfit}` : ''}</span>
          `;
        } else if (!isAfterLast) {
          const thisDate = new Date(year, month, day);
          const dayOfWeek = thisDate.getDay(); // 0 = Sun, 6 = Sat
          const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
          const isFuture = thisDate > today;
          const capturedDay = day;

          box.className = "border rounded-lg p-2 h-20 flex flex-col justify-start items-start relative";

          if (isWeekend || isFuture) {
            box.classList.add("bg-gray-200", "text-gray-400", "cursor-not-allowed");
          } else {
            box.classList.add("cursor-pointer", "hover:bg-gray-100");
            box.addEventListener("click", () => {
              window.location.href = `entry.html?day=${capturedDay}&month=${month + 1}&year=${year}&returnMonth=${month + 1}&returnYear=${year}`;
            });
          }

          box.innerHTML = `
            <span class="absolute top-1 left-1 text-sm">${capturedDay}</span>
            <span id="profit-${capturedDay}" class="mt-6 ml-1 text-sm font-medium"></span>
          `;

          if (thisDate.toDateString() === today.toDateString()) {
            box.classList.add("border-4", "border-blue-500");
          }

          const key = `entry-${year}-${month + 1}-${capturedDay}-profit`;
          const savedProfit = localStorage.getItem(key);
          if (savedProfit && !isWeekend) {
            const profitVal = parseFloat(savedProfit);
            const profitEl = box.querySelector(`#profit-${capturedDay}`);
            profitEl.textContent = `$${profitVal}`;
            profitEl.classList.add(profitVal < 0 ? "text-red-600" : "text-green-600");
            weekProfit += profitVal;
          }

          day++;
        } else {
          const key = `entry-${nextMonthYear}-${nextMonth + 1}-${nextDay}-profit`;
          const savedProfit = localStorage.getItem(key);

          box.className = "border rounded-lg p-2 h-20 flex flex-col justify-start items-start relative bg-gray-100 text-gray-400 cursor-not-allowed";
          box.innerHTML = `
            <span class="absolute top-1 left-1 text-sm">${nextDay}</span>
            <span class="mt-6 ml-1 text-sm text-green-500 font-medium">${savedProfit ? `$${savedProfit}` : ''}</span>
          `;
          nextDay++;
        }

        weekRow.appendChild(box);
        weekDayIndex++;

        if (weekDayIndex % 7 === 0) {
          const totalBox = document.createElement("div");
          const profitClass = weekProfit >= 0 ? "text-green-600" : "text-red-600";
          totalBox.className = `bg-blue-50 ${profitClass} text-sm font-semibold flex items-center justify-center border rounded-lg h-20 px-2 whitespace-nowrap`;
          totalBox.textContent = `$${weekProfit.toLocaleString()}`;
          weekRow.appendChild(totalBox);
        }
      }

      if (weekRow) {
        calendarGrid.appendChild(weekRow);
      }
    }

    prevMonthBtn.addEventListener("click", () => {
      viewingDate.setMonth(viewingDate.getMonth() - 1);
      renderCalendar(viewingDate);
    });

    nextMonthBtn.addEventListener("click", () => {
      const nextMonth = new Date(viewingDate.getFullYear(), viewingDate.getMonth() + 1);
      const isPastToday = nextMonth <= new Date(currentYear, currentMonth, 1);
      if (isPastToday) {
        viewingDate.setMonth(viewingDate.getMonth() + 1);
        renderCalendar(viewingDate);
      }
    });

    renderCalendar(viewingDate);
  </script>

</body>
</html>
