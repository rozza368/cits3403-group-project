<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up | Cryptocal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="{{ url_for('static', filename='css/main.css') }}" rel="stylesheet" />
</head>
<body class="relative min-h-screen bg-gradient-to-br from-[#e0e7ff] via-[#f1f5f9] to-[#cbd5e1] flex flex-col overflow-x-hidden">
  <!-- Decorative Background Shapes -->
  <div class="bg-shape1"></div>
  <div class="bg-shape2"></div>
  <div class="bg-shape3"></div>
  <!-- Top Bar -->
  <header class="relative z-10 w-full flex items-center justify-between px-8 py-6">
    <span class="text-3xl font-black text-blue-700 tracking-tight drop-shadow">Cryptocal</span>
    <div class="flex items-center space-x-4">
      <a href="{{ url_for('login') }}" class="ml-2 text-blue-700 font-bold hover:underline text-lg">Sign In</a>
    </div>
  </header>
  <!-- Main Section -->
  <main class="relative z-10 flex-1 flex flex-col items-center justify-center pt-8 pb-0">
    <div class="w-full max-w-md mx-auto bg-white/80 rounded-2xl shadow-md p-8">
      <h2 class="text-2xl font-bold text-center mb-4 text-blue-700">Sign Up</h2>
      <form id="signupForm" method="POST" action="{{ url_for('signup') }}" class="space-y-4">
        <div>
          <label for="email" class="block text-sm font-medium text-blue-700">Email</label>
          <input type="email" id="email" name="email" class="w-full px-3 py-2 rounded-full font-medium bg-gray-100 border border-gray-200 placeholder-gray-500 text-sm focus:outline-none focus:border-blue-400 focus:bg-white" required />
        </div>
        <div>
          <label for="username" class="block text-sm font-medium text-blue-700">Username</label>
          <input type="text" id="username" name="username" class="w-full px-3 py-2 rounded-full font-medium bg-gray-100 border border-gray-200 placeholder-gray-500 text-sm focus:outline-none focus:border-blue-400 focus:bg-white" required />
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-blue-700">Password</label>
          <div class="relative">
            <input type="password" id="password" name="password" class="w-full px-3 py-2 rounded-full font-medium bg-gray-100 border border-gray-200 placeholder-gray-500 text-sm focus:outline-none focus:border-blue-400 focus:bg-white pr-12" required />
            <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500">
              <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0zm6 0c0 3.866-3.582-7-8-7s-8-3.134-8-7 3.582-7 8-7 8 3.134 8 7z" />
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" class="w-full tracking-wide font-semibold bg-gradient-to-r from-blue-500 to-blue-300 text-white px-5 py-2 rounded-full hover:from-blue-600 hover:to-blue-400 transition-all duration-300 ease-in-out focus:shadow-outline focus:outline-none">Sign Up</button>
      </form>
    </div>
  </main>
  <script>
    function togglePassword() {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M13.875 18.825A10.05 10.05 0 0112 19c-4.418 0-8-3.134-8-7a9.978 9.978 0 013.563-7.563M15 12a3 3 0 11-6 0 3 3 0 016 0zm6 0c0 1.657-.672 3.157-1.757 4.243M3 3l18 18" />`;
      } else {
        pwd.type = 'password';
        icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M15 12a3 3 0 11-6 0 3 3 0 016 0zm6 0c0 3.866-3.582-7-8-7s-8-3.134-8-7 3.582-7 8-7 8 3.134 8 7z" />`;
      }
    }
  </script>
</body>
</html>
