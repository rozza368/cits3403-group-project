<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 flex justify-center items-center min-h-screen">
  <div class="w-full max-w-md p-4 bg-white rounded-2xl shadow-md">
    <h2 class="text-2xl font-bold text-center mb-4">Sign Up</h2>
    <form id="signupForm" class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium">Email</label>
        <input type="email" id="email" class="w-full border rounded-lg p-2" required />
      </div>
      <div>
        <label for="username" class="block text-sm font-medium">Username</label>
        <input type="text" id="username" class="w-full border rounded-lg p-2" required />
      </div>
      <div>
        <label for="password" class="block text-sm font-medium">Password</label>
        <input type="password" id="password" class="w-full border rounded-lg p-2" required />
      </div>
      <button type="submit" class="w-full bg-blue-500 text-white font-bold py-2 rounded-lg">Sign Up</button>
    </form>
  </div>

  <script src="{{ url_for('static', filename='js/signup.js') }}"></script>
</body>
</html>
