<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enter Profit</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="{{ url_for('static', filename='css/main.css') }}" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'Coolvetica';
      src: url("{{ url_for('static', filename='fonts/Coolvetica Rg.otf') }}") format('opentype');
      font-weight: normal;
      font-style: normal;
    }
    body {
      font-family: 'Coolvetica', 'Inter', 'sans-serif';
      background-image: url('{{ url_for('static', filename='images/background.png') }}');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
    }
    .bg-white-glass {
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(8px);
    }
    .particle-wrapper {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    .particle {
      position: absolute;
      width: 6px;
      height: 6px;
      background-color: #3dff90;
      border-radius: 50%;
      opacity: 0;
      animation: floatUp 15s linear infinite;
      animation-fill-mode: both;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) translateX(0); opacity: 0; }
      10% { opacity: 0.6; }
      50% { transform: translateY(-100vh) translateX(20px); opacity: 0.3; }
      100% { transform: translateY(-200vh) translateX(-20px); opacity: 0; }
    }
  </style>
</head>
<body class="relative min-h-screen flex flex-col overflow-x-hidden">
  <!-- Decorative Floating Particles -->
  <div class="particle-wrapper pointer-events-none absolute inset-0 z-0">
    <div class="particle" style="top: 105%; left: 5%; animation-duration: 14s; animation-delay: 0s;"></div>
    <div class="particle" style="top: 110%; left: 10%; animation-duration: 16s; animation-delay: 2s;"></div>
    <div class="particle" style="top: 115%; left: 15%; animation-duration: 18s; animation-delay: 4s;"></div>
    <div class="particle" style="top: 102%; left: 20%; animation-duration: 12s; animation-delay: 1s;"></div>
    <div class="particle" style="top: 108%; left: 25%; animation-duration: 20s; animation-delay: 3s;"></div>
    <div class="particle" style="top: 112%; left: 30%; animation-duration: 15s; animation-delay: 5s;"></div>
    <div class="particle" style="top: 118%; left: 35%; animation-duration: 17s; animation-delay: 2s;"></div>
  </div>
  <!-- Navbar -->
  {% include "_navbar.html" %}
  <main class="flex-1 w-full max-w-3xl mx-auto px-4 py-8 z-10">
    <div class="bg-white-glass rounded-2xl shadow-md p-6 w-full flex flex-col h-full">
      <!-- Header -->
      <div class="flex justify-between items-center mb-2">
        <button onclick="window.location.href='/index'"
          class="bg-white text-blue-500 font-semibold py-2 px-4 rounded shadow hover:bg-gray-100 transition">
          ← Back
        </button>
        <h1 class="text-xl font-bold text-center flex-1" id="dateHeading"></h1>
        <div class="w-16"></div>
      </div>
      <!-- Scrollable Content -->
      <div class="flex-1 overflow-y-auto space-y-4">
        <!-- Carousel -->
        <div id="carouselWrapper" class="relative w-full hidden">
          <div class="relative w-full h-[50vh]">
            <img id="carouselImage" class="w-full h-full object-contain rounded-xl" />
            <button id="prevBtn" class="absolute left-2 top-1/2 transform -translate-y-1/2 bg-white shadow rounded-full w-8 h-8 flex items-center justify-center text-xl">&#8592;</button>
            <button id="nextBtn" class="absolute right-2 top-1/2 transform -translate-y-1/2 bg-white shadow rounded-full w-8 h-8 flex items-center justify-center text-xl">&#8594;</button>
            <button id="deleteBtn" class="absolute top-2 right-2 bg-white text-red-500 border border-red-300 rounded-full w-7 h-7 flex items-center justify-center shadow hover:bg-red-100">
              &times;
            </button>
          </div>
        </div>
        <!-- Upload -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Upload or Paste Images (Max 5)</label>
          <input type="file" id="imageInput" accept="image/*" multiple class="w-full text-sm" />
          <p id="imageCount" class="text-sm text-gray-500 mt-1">0/5 images uploaded</p>
        </div>
        <!-- Profit -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Profit</label>
          <input type="number" id="profitInput" class="border rounded p-2 w-full text-sm"
                placeholder="Enter profit for the day" />
        </div>
        <!-- Notes -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Trade Notes</label>
          <textarea id="notesInput" rows="2" class="border rounded p-2 w-full text-sm resize-none"
                    placeholder="Write your notes for the day..."></textarea>
        </div>
      </div>
      <!-- Save Button -->
      <div class="mt-4">
        <button id="saveBtn"
          class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded shadow w-full">
          Save
        </button>
        <button id="deleteEntryBtn"
          class="bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-4 rounded shadow w-full mt-2 hidden">
          Delete Entry
        </button>
      </div>
    </div>
  </main>
  <script src="{{ url_for('static', filename='js/entry.js') }}"></script>
</body>
</html>
