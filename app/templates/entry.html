<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enter Profit</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="flex flex-col h-screen items-center justify-center px-4">
    <div class="bg-white rounded-2xl shadow-md p-4 w-full max-w-3xl flex flex-col h-full">

      <!-- Header -->
      <div class="flex justify-between items-center mb-2">
        <button onclick="window.location.href='/index'"
          class="bg-white text-blue-500 font-semibold py-2 px-4 rounded shadow hover:bg-gray-100 transition">
          ← Back
        </button>
        <h1 class="text-xl font-bold text-center flex-1" id="dateHeading"></h1>
        <div class="w-16"></div>
      </div>

      <!-- Scrollable Content -->
      <div class="flex-1 overflow-y-auto space-y-4">

        <!-- Carousel -->
        <div id="carouselWrapper" class="relative w-full hidden">
          <div class="relative w-full h-[50vh]">
            <img id="carouselImage" class="w-full h-full object-contain rounded-xl" />
            <button id="prevBtn" class="absolute left-2 top-1/2 transform -translate-y-1/2 bg-white shadow rounded-full w-8 h-8 flex items-center justify-center text-xl">&#8592;</button>
            <button id="nextBtn" class="absolute right-2 top-1/2 transform -translate-y-1/2 bg-white shadow rounded-full w-8 h-8 flex items-center justify-center text-xl">&#8594;</button>
            <button id="deleteBtn" class="absolute top-2 right-2 bg-white text-red-500 border border-red-300 rounded-full w-7 h-7 flex items-center justify-center shadow hover:bg-red-100">
              &times;
            </button>
          </div>
        </div>

        <!-- Upload -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Upload or Paste Images (Max 5)</label>
          <input type="file" id="imageInput" accept="image/*" multiple class="w-full text-sm" />
          <p id="imageCount" class="text-sm text-gray-500 mt-1">0/5 images uploaded</p>
        </div>

        <!-- Profit -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Profit</label>
          <input type="number" id="profitInput" class="border rounded p-2 w-full text-sm"
                placeholder="Enter profit for the day" />
        </div>

        <!-- Notes -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Trade Notes</label>
          <textarea id="notesInput" rows="2" class="border rounded p-2 w-full text-sm resize-none"
                    placeholder="Write your notes for the day..."></textarea>
        </div>
      </div>

      <!-- Save Button -->
      <div class="mt-4">
        <button id="saveBtn"
          class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded shadow w-full">
          Save
        </button>
        <button id="deleteEntryBtn"
          class="bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-4 rounded shadow w-full mt-2 hidden">
          Delete Entry
        </button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/entry.js') }}"></script>
</body>
</html>
