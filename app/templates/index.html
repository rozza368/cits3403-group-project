<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profit Calendar</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="{{ url_for('static', filename='css/main.css') }}" rel="stylesheet" />
  <link rel="stylesheet" href="https://use.typekit.net/cij8xdo.css">
  <style>
    @font-face {
      font-family: 'Coolvetica';
      src: url("{{ url_for('static', filename='fonts/Coolvetica Rg.otf') }}") format('opentype');
      font-weight: normal;
      font-style: normal;
    }
    body, html, * {
      font-family: 'din-2014', 'Inter', sans-serif;
      font-weight: 600; /* demi */
    }
    body {
      background-image: url('{{ url_for('static', filename='images/background.png') }}');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
    }
    .bg-white-glass {
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(8px);
    }
    .particle-wrapper {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    .particle {
      position: absolute;
      width: 6px;
      height: 6px;
      background-color: #3dff90;
      border-radius: 50%;
      opacity: 0;
      animation: floatUp 15s linear infinite;
      animation-fill-mode: both;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) translateX(0); opacity: 0; }
      10% { opacity: 0.6; }
      50% { transform: translateY(-100vh) translateX(20px); opacity: 0.3; }
      100% { transform: translateY(-200vh) translateX(-20px); opacity: 0; }
    }
    .calendar-gradient-bg {
      background: radial-gradient(ellipse at top left, #1a2a1f 60%, #0a0f0c 100%);
      border: 1.5px solid #1affb2;
    }
    .calendar-cell {
      background: rgba(0,0,0,0.7);
      border: 1.5px solid #1affb2;
      /*box-shadow: 0 0 8px 0 #1affb2;*/
      color: #fff;
      position: relative;
      border-radius: 0.75rem;
      min-height: 5rem;
      transition: box-shadow 0.2s;
    }
    .calendar-cell.inactive {
      background: rgba(0,0,0,0.3);
      color: #4b5563;
      border: 1.5px solid #222;
      box-shadow: none;
    }
    .calendar-cell.selected, .calendar-cell.today {
      border: 1.5px solid #1affb2;
      box-shadow: 0 0 5px 1px #1affb2, 0 0 0 2.5px #1affb2 inset;
      background: rgba(0,0,0,0.7); /* Match regular active day background */
      color: #fff;
    }
    .calendar-profit {
      font-weight: bold;
      font-size: 1.1rem;
      margin-top: 1.5rem;
      display: block;
    }
    .calendar-profit.positive { color: #1affb2; }
    .calendar-profit.negative { color: #ff4b4b; }
    .calendar-header {
      background: rgba(0,0,0,0.8);
      color: #1affb2;
      border-radius: 0.75rem;
      padding: 0.5rem 0;
      font-weight: bold;
      font-size: 1.1rem;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body class="relative min-h-screen flex flex-col overflow-x-hidden">
  <!-- Decorative Floating Particles -->
  <div class="particle-wrapper pointer-events-none absolute inset-0 z-0">
    <div class="particle" style="top: 105%; left: 5%; animation-duration: 14s; animation-delay: 0s;"></div>
    <div class="particle" style="top: 110%; left: 10%; animation-duration: 16s; animation-delay: 2s;"></div>
    <div class="particle" style="top: 115%; left: 15%; animation-duration: 18s; animation-delay: 4s;"></div>
    <div class="particle" style="top: 102%; left: 20%; animation-duration: 12s; animation-delay: 1s;"></div>
    <div class="particle" style="top: 108%; left: 25%; animation-duration: 20s; animation-delay: 3s;"></div>
    <div class="particle" style="top: 112%; left: 30%; animation-duration: 15s; animation-delay: 5s;"></div>
    <div class="particle" style="top: 118%; left: 35%; animation-duration: 17s; animation-delay: 2s;"></div>
  </div>
  <!-- Navbar -->
  {% include "_navbar.html" %}
  <main class="w-full flex justify-center mt-8 flex-1 z-10">
    <div class="w-full max-w-6xl px-4">
      <div class="calendar-gradient-bg rounded-2xl p-6 w-full">
        <!-- Header -->
        <div class="flex justify-between items-center mb-4">
          <button id="prevMonthBtn" class="text-[#1affb2] font-medium hover:underline">←</button>
          <h2 id="monthYear" class="text-2xl font-bold text-center text-white"></h2>
          <button id="nextMonthBtn" class="text-[#1affb2] font-medium hover:underline">→</button>
        </div>
        <!-- Weekday Headers -->
        <div class="grid grid-cols-8 gap-2 text-center font-semibold mb-2">
          <div class="calendar-header">Mon</div>
          <div class="calendar-header">Tue</div>
          <div class="calendar-header">Wed</div>
          <div class="calendar-header">Thu</div>
          <div class="calendar-header">Fri</div>
          <div class="calendar-header">Sat</div>
          <div class="calendar-header">Sun</div>
          <div class="calendar-header">Total</div>
        </div>
        <!-- Calendar Grid -->
        <div id="calendarGrid" class="flex flex-col gap-2"></div>
      </div>
    </div>
  </main>
  <script src="{{ url_for('static', filename='js/index.js') }}"></script>
  <footer class="w-full bg-black py-8 mt-12">
    <div class="max-w-7xl mx-auto flex items-center justify-center gap-4 px-4">
      <img src="{{ url_for('static', filename='logo2.png') }}" alt="TradeM8 Logo" class="h-8">
      <span class="text-white text-lg font-semibold tracking-wide">CITS3403 2025</span>
    </div>
  </footer>
</body>
</html>
