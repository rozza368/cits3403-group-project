<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Monthly Calendar</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 flex justify-center items-center min-h-screen">
  <div class="w-full max-w-4xl p-4">
    <div id="calendar" class="bg-white rounded-2xl shadow-md p-6">
      <h2 id="monthYear" class="text-2xl font-bold text-center mb-4"></h2>
      <div class="grid grid-cols-7 gap-2 text-center font-semibold">
        <div>Sun</div>
        <div>Mon</div>
        <div>Tue</div>
        <div>Wed</div>
        <div>Thu</div>
        <div>Fri</div>
        <div>Sat</div>
      </div>
      <div id="daysGrid" class="grid grid-cols-7 gap-2 mt-2"></div>
    </div>
  </div>

  <script>
    const calendar = document.getElementById("calendar");
    const monthYear = document.getElementById("monthYear");
    const daysGrid = document.getElementById("daysGrid");

    const now = new Date();
    const year = now.getFullYear();
    const month = now.getMonth();
    const todayDate = now.getDate();

    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();

    const monthNames = [
      "January", "February", "March", "April", "May", "June",
      "July", "August", "September", "October", "November", "December"
    ];

    monthYear.textContent = `${monthNames[month]} ${year}`;

    // Fill in blank days before the 1st
    for (let i = 0; i < firstDay; i++) {
      const blank = document.createElement("div");
      daysGrid.appendChild(blank);
    }

    // Fill in the actual days
    for (let day = 1; day <= lastDate; day++) {
      const box = document.createElement("div");
      box.className = "border rounded-lg p-2 h-20 flex justify-start items-start relative";
      box.innerHTML = `<span class="absolute top-1 left-1 text-sm">${day}</span>`;

      // Highlight current day
      if (day === todayDate) {
        box.classList.add("bg-blue-500", "text-white", "font-bold");
      }

      daysGrid.appendChild(box);
    }
  </script>
</body>
</html>
